#Gradle
org.gradle.jvmargs=-Xmx8128M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8128M"

version=1.2.0
group=io.github.alexzhirkevich

#Kotlin
kotlin.code.style=official
jvmTarget=11
